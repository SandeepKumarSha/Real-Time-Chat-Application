<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat | Hello</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.0.3">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="app-brand">💬 Hello</div>
        </div>

        <div class="sidebar-content">
            <!-- Channels / Rooms Section -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">Channels</div>
                <ul class="sidebar-list">
                    <li id="channel-group" class="sidebar-item active" onclick="selectChat('group')">
                        <span class="avatar" style="background: var(--accent-gradient);">🌐</span>
                        <span style="flex: 1;">Group Chat</span>
                        <span id="badge-group" class="unread-badge" style="display: none;">0</span>
                        <span class="sidebar-item-status online"></span>
                    </li>
                </ul>
            </div>

            <!-- Direct Messages / Users Section -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">Direct Messages</div>
                <ul id="online-users" class="sidebar-list">
                    <!-- Dynamically populated online users -->
                </ul>
            </div>
        </div>

        <!-- Current User Profile Panel at the Bottom -->
        <div class="current-user-panel">
            <div class="user-profile-info">
                <div id="current-user-avatar" class="avatar"></div>
                <div class="user-profile-details">
                    <span class="user-profile-name">{{ username }}</span>
                    <span class="user-profile-status"><span class="sidebar-item-status online"></span>Online</span>
                </div>
            </div>
            <a href="/logout" class="logout-btn" title="Logout">
                Logout
            </a>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-main">
        <div class="chat-header">
            <div style="display: flex; align-items: center;">
                <button class="back-btn" onclick="showSidebar()" title="Back to chats">
                    ←
                </button>
                <div class="chat-header-info" style="display: flex; align-items: center; gap: 10px;">
                    <div style="display: flex; flex-direction: column;">
                        <div id="chat-header-title" class="chat-header-title">🌐 Group Chat</div>
                        <div id="chat-header-subtitle" class="chat-header-subtitle">Public channel for everyone</div>
                    </div>
                    <span id="chat-header-badge" class="chat-header-badge group-badge">Public</span>
                </div>
            </div>
            <!-- Shortcut to Group Chat -->
            <button id="group-shortcut-btn" class="group-shortcut-btn" onclick="selectChat('group')" style="display: none;">
                🌐 Go to Group Chat
            </button>
        </div>

        <div id="chat-box" class="chat-box">
            <!-- Messages will load dynamically -->
        </div>

        <div id="typing-indicator"></div>

        <div class="input-area">
            <div class="message-input-wrapper">
                <input
                    type="text"
                    id="message"
                    class="message-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                >
            </div>
            <button class="send-btn" onclick="sendMessage()">
                Send
            </button>
        </div>
    </div>
</div>

<script>
const socket = io();
const username = "{{ username }}";
let selectedUser = 'group';
let typingTimeout = null;

// Dynamic avatar color selection helper
function getAvatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    const colors = [
        '#4f46e5', '#db2777', '#7c3aed', '#059669', 
        '#d97706', '#2563eb', '#dc2626', '#0d9488'
    ];
    return colors[Math.abs(hash) % colors.length];
}

// Render dynamic avatar for current user
const myAvatar = document.getElementById('current-user-avatar');
myAvatar.innerText = username.charAt(0).toUpperCase();
myAvatar.style.background = getAvatarColor(username);

// Establish connection
socket.emit('user_connected', username);

// Load messages function
async function loadMessages() {
    const response = await fetch(`/get_messages/${selectedUser}`);
    const messages = await response.json();
    
    let box = document.getElementById('chat-box');
    box.innerHTML = '';

    const chatType = (selectedUser === 'group') ? 'group-msg' : 'dm-msg';

    if (messages.length === 0) {
        box.innerHTML = `
            <div class="chat-empty-state">
                <div class="chat-empty-icon">💬</div>
                <div class="chat-empty-title">No messages yet</div>
                <p>Be the first to say hi!</p>
            </div>
        `;
    } else {
        messages.forEach(function(msg) {
            let alignment = (msg.sender === username) ? 'own' : 'other';
            box.innerHTML += `
                <div class="message-wrapper ${alignment} ${chatType}">
                    <div class="message-meta">${msg.sender}</div>
                    <div class="message-bubble">${msg.content}</div>
                    <div class="message-time">${msg.timestamp}</div>
                </div>
            `;
        });
    }
    box.scrollTop = box.scrollHeight;
}

// Select chat channel or DM
function selectChat(target) {
    selectedUser = target;
    
    document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
    });
    
    const chatMain = document.querySelector('.chat-main');
    const headerBadge = document.getElementById('chat-header-badge');
    const shortcutBtn = document.getElementById('group-shortcut-btn');

    if (target === 'group') {
        const groupItem = document.getElementById('channel-group');
        if (groupItem) groupItem.classList.add('active');
        document.getElementById('chat-header-title').innerText = '🌐 Group Chat';
        document.getElementById('chat-header-subtitle').innerText = 'Public channel for everyone';
        
        if (chatMain) {
            chatMain.classList.remove('dm-mode');
            chatMain.classList.add('group-mode');
        }
        if (headerBadge) {
            headerBadge.innerText = 'Public';
            headerBadge.className = 'chat-header-badge group-badge';
        }
        if (shortcutBtn) {
            shortcutBtn.style.display = 'none';
        }
    } else {
        const userItem = document.getElementById(`user-${target}`);
        if (userItem) userItem.classList.add('active');
        document.getElementById('chat-header-title').innerText = `👤 Chatting with ${target}`;
        document.getElementById('chat-header-subtitle').innerText = 'End-to-end direct message';
        
        if (chatMain) {
            chatMain.classList.remove('group-mode');
            chatMain.classList.add('dm-mode');
        }
        if (headerBadge) {
            headerBadge.innerText = 'Direct Message';
            headerBadge.className = 'chat-header-badge dm-badge';
        }
        if (shortcutBtn) {
            shortcutBtn.style.display = 'flex';
        }
        
        socket.emit('join_private_room', {
            user1: username,
            user2: selectedUser
        });
    }
    
    // Clear unread badge
    const badge = document.getElementById(`badge-${target}`);
    if (badge) {
        badge.innerText = '0';
        badge.style.display = 'none';
    }

    // Switch views on mobile
    const container = document.querySelector('.chat-container');
    container.classList.add('chat-active');
    
    loadMessages();
}

// Mobile sidebar view toggle back
function showSidebar() {
    const container = document.querySelector('.chat-container');
    container.classList.remove('chat-active');
}

// Render dynamic online users list
socket.on('update_users', function(users) {
    let list = document.getElementById('online-users');
    list.innerHTML = '';

    users.forEach(function(user) {
        if (user !== username) {
            let li = document.createElement('li');
            li.id = `user-${user}`;
            li.classList.add('sidebar-item');
            if (selectedUser === user) {
                li.classList.add('active');
            }

            const color = getAvatarColor(user);
            const initials = user.charAt(0).toUpperCase();

            li.innerHTML = `
                <div class="avatar" style="background: ${color};">${initials}</div>
                <span style="flex: 1;">${user}</span>
                <span id="badge-${user}" class="unread-badge" style="display: none;">0</span>
                <span class="sidebar-item-status online"></span>
            `;

            li.onclick = function() {
                selectChat(user);
            };

            list.appendChild(li);
        }
    });
});

// Receive message event
socket.on('receive_message', function(data) {
    const isCurrentRoom = 
        (selectedUser === 'group' && data.receiver === 'group') ||
        (selectedUser !== 'group' && (
            (data.username === selectedUser && data.receiver === username) ||
            (data.username === username && data.receiver === selectedUser)
        ));

    if (!isCurrentRoom) {
        // Increment unread badge count
        const target = (data.receiver === 'group') ? 'group' : data.username;
        const badge = document.getElementById(`badge-${target}`);
        if (badge) {
            let count = parseInt(badge.innerText) || 0;
            count++;
            badge.innerText = count;
            badge.style.display = 'inline-block';
        }
        return;
    }

    let box = document.getElementById('chat-box');
    
    // Clear empty state if present
    const emptyState = box.querySelector('.chat-empty-state');
    if (emptyState) {
        box.innerHTML = '';
    }

    let alignment = (data.username === username) ? 'own' : 'other';
    let chatType = (data.receiver === 'group') ? 'group-msg' : 'dm-msg';

    box.innerHTML += `
        <div class="message-wrapper ${alignment} ${chatType}">
            <div class="message-meta">${data.username}</div>
            <div class="message-bubble">${data.message}</div>
            <div class="message-time">${data.timestamp}</div>
        </div>
    `;

    box.scrollTop = box.scrollHeight;
});

// Typing indicator socket receiver
socket.on('show_typing', function(data) {
    const isTypingInCurrentRoom = 
        (selectedUser === 'group' && data.receiver === 'group') ||
        (selectedUser !== 'group' && data.receiver === username && data.username === selectedUser);

    if (!isTypingInCurrentRoom) {
        return;
    }

    document.getElementById('typing-indicator').innerText = `${data.username} is typing...`;

    if (typingTimeout) {
        clearTimeout(typingTimeout);
    }

    typingTimeout = setTimeout(function() {
        document.getElementById('typing-indicator').innerText = '';
    }, 1000);
});

// Send message logic
function sendMessage() {
    let messageInput = document.getElementById('message');
    let content = messageInput.value.trim();

    if (content === '') {
        return;
    }

    socket.emit('send_message', {
        username: username,
        receiver: selectedUser,
        message: content
    });

    messageInput.value = '';
}

// Typing listener
document.getElementById('message').addEventListener('input', function() {
    socket.emit('typing', {
        username: username,
        receiver: selectedUser
    });
});

// Enter key submit
document.getElementById('message').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});

// Initialize by opening the group chat
document.addEventListener('DOMContentLoaded', () => {
    // Initial state: select Group Chat, show sidebar on mobile (remove active class initially)
    if (window.innerWidth <= 768) {
        showSidebar();
    }
    selectChat('group');
});
</script>

</body>
</html>
